            echo ""
            echo "[1/3] Pulling image from ACR..."
            sudo docker compose pull

            echo ""
            echo "[2/3] Starting services..."
            sudo docker compose up -d

            echo ""
            echo "[3/3] Health check..."
            sleep 5
            HEALTHY=false
            for i in 1 2 3 4 5; do
              if sudo docker compose ps --status running 2>/dev/null | grep -qE '(Up|running|healthy)'; then
                HEALTHY=true
                echo "✅ tokease-token-factory 容器运行中 (第 ${i} 次检查)"
                break
              fi
              echo "⏳ 等待... (${i}/5)"
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "⚠️ 健康检查未通过, 当前容器状态:"
              sudo docker compose ps
              sudo docker compose logs --tail=30
              exit 1
            fi

            sudo docker compose ps

      - name: Deploy demo-tokease-token-factory (43.138.142.105)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_B_HOST }}
          port: ${{ secrets.SERVER_B_PORT || 22 }}
          username: ${{ secrets.SERVER_B_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_105 }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY_ACR }}/${{ env.IMAGE_NAME_ACR }}:${{ inputs.tag }}"
            DIR="/home/ubuntu/demo-tokease-token-factory"

            echo "========================================="
            echo "  服务器: ${{ secrets.SERVER_B_HOST }}"
            echo "  实例:   demo-tokease-token-factory"
            echo "  镜像:   $IMAGE"
            echo "========================================="

            cd "$DIR" || { echo "❌ 目录不存在: $DIR"; exit 1; }

            echo "[1/3] Pulling image from ACR..."
            sudo docker compose pull

            echo "[2/3] Starting services..."
            sudo docker compose up -d

            echo "[3/3] Health check..."
            sleep 5
            HEALTHY=false
            for i in 1 2 3 4 5; do
              if sudo docker compose ps --status running 2>/dev/null | grep -qE '(Up|running|healthy)'; then
                HEALTHY=true
                echo "✅ demo-tokease-token-factory 容器运行中 (第 ${i} 次检查)"
                break
              fi
              echo "⏳ 等待... (${i}/5)"
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "⚠️ 健康检查未通过, 当前容器状态:"
              sudo docker compose ps
              sudo docker compose logs --tail=30
              exit 1
            fi

            sudo docker compose ps

      - name: Deploy token-factory (43.138.142.105)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_B_HOST }}
          port: ${{ secrets.SERVER_B_PORT || 22 }}
          username: ${{ secrets.SERVER_B_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_105 }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY_ACR }}/${{ env.IMAGE_NAME_ACR }}:${{ inputs.tag }}"
            DIR="/home/ubuntu/token-factory"

            echo "========================================="
            echo "  服务器: ${{ secrets.SERVER_B_HOST }}"
            echo "  实例:   token-factory"
            echo "  镜像:   $IMAGE"
            echo "========================================="

            cd "$DIR" || { echo "❌ 目录不存在: $DIR"; exit 1; }

            echo "[1/3] Pulling image from ACR..."
            sudo docker compose pull

            echo "[2/3] Starting services..."
            sudo docker compose up -d

            echo "[3/3] Health check..."
            sleep 5
            HEALTHY=false
            for i in 1 2 3 4 5; do
              if sudo docker compose ps --status running 2>/dev/null | grep -qE '(Up|running|healthy)'; then
                HEALTHY=true
                echo "✅ token-factory 容器运行中 (第 ${i} 次检查)"
                break
              fi
              echo "⏳ 等待... (${i}/5)"
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "⚠️ 健康检查未通过, 当前容器状态:"
              sudo docker compose ps
              sudo docker compose logs --tail=30
              exit 1
            fi

            sudo docker compose ps

      - name: Deploy token-factory-123-tok (43.138.142.105)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_B_HOST }}
          port: ${{ secrets.SERVER_B_PORT || 22 }}
          username: ${{ secrets.SERVER_B_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_105 }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY_ACR }}/${{ env.IMAGE_NAME_ACR }}:${{ inputs.tag }}"
            DIR="/home/ubuntu/token-factory-123-tok"

            echo "========================================="
            echo "  服务器: ${{ secrets.SERVER_B_HOST }}"
            echo "  实例:   token-factory-123-tok"
            echo "  镜像:   $IMAGE"
            echo "========================================="

            cd "$DIR" || { echo "❌ 目录不存在: $DIR"; exit 1; }

