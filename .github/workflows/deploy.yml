name: Deploy to Servers

# ============================================================================
# Token Factory — SSH 远程部署工作流
#
# 前提: 先手动运行 "编译 Docker 镜像 (GHCR)" 工作流构建并推送镜像
#       镜像地址: ghcr.io/fyinfor/token-factory:latest
#
# 部署目标 (两台服务器 × 两个实例 = 4 个部署):
#   服务器 A (43.132.223.112):
#     ├─ /home/ubuntu/tokease-token-factory
#     └─ /home/ubuntu/token-factory
#   服务器 B (43.138.142.105):
#     ├─ /home/ubuntu/tokease-token-factory
#     └─ /home/ubuntu/token-factory
#
# Server A: pull → up → 健康检查 → 清理 → docker save → scp → Server B
# Server B: docker load tar → up → 健康检查 → 清理
#   (Server B 无法直连 GHCR, 通过 Server A 中转镜像)
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签'
        required: true
        default: 'latest'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fyinfor/token-factory

# 部署脚本 (复用, 避免重复)
# 用法: 在 SSH script 中 source 此脚本后调用 deploy_instance <路径>
# 注意: 此处仅作为文档说明, 实际脚本内联在 job 中

jobs:
  # ═════════════════════════════════════════════════════════════════════════
  # 服务器 A: 43.132.223.112  (SSH Key 认证)
  # ═════════════════════════════════════════════════════════════════════════
  deploy-server-a:
    name: Deploy → 43.132.223.112
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy tokease-token-factory (43.132.223.112)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_A_HOST }}
          port: ${{ secrets.SERVER_A_PORT || 22 }}
          username: ${{ secrets.SERVER_A_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_112 }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
            DIR="/home/ubuntu/tokease-token-factory"

            echo "========================================="
            echo "  服务器: ${{ secrets.SERVER_A_HOST }}"
            echo "  实例:   tokease-token-factory"
            echo "  镜像:   $IMAGE"
            echo "  时间:   $(date '+%Y-%m-%d %H:%M:%S')"
            echo "========================================="

            cd "$DIR" || { echo "❌ 目录不存在: $DIR"; exit 1; }

            echo ""
            echo "[1/3] Pulling image..."
            sudo docker compose pull

            echo ""
            echo "[2/3] Starting services..."
            sudo docker compose up -d

            echo ""
            echo "[3/3] Health check..."
            sleep 5
            HEALTHY=false
            for i in 1 2 3 4 5; do
              # 检查容器是否 running
              if sudo docker compose ps --status running 2>/dev/null | grep -qE '(Up|running|healthy)'; then
                HEALTHY=true
                echo "✅ tokease-token-factory 容器运行中 (第 ${i} 次检查)"
                break
              fi
              echo "⏳ 等待... (${i}/5)"
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "⚠️ 健康检查未通过, 当前容器状态:"
              sudo docker compose ps
              sudo docker compose logs --tail=30
              exit 1
            fi

            sudo docker compose ps

      - name: Deploy token-factory (43.132.223.112)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_A_HOST }}
          port: ${{ secrets.SERVER_A_PORT || 22 }}
          username: ${{ secrets.SERVER_A_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_112 }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
            DIR="/home/ubuntu/token-factory"

            echo "========================================="
            echo "  服务器: ${{ secrets.SERVER_A_HOST }}"
            echo "  实例:   token-factory"
            echo "  镜像:   $IMAGE"
            echo "========================================="

            cd "$DIR" || { echo "❌ 目录不存在: $DIR"; exit 1; }

            echo "[1/3] Pulling image..."
            sudo docker compose pull

            echo "[2/3] Starting services..."
            sudo docker compose up -d

            echo "[3/3] Health check..."
            sleep 5
            HEALTHY=false
            for i in 1 2 3 4 5; do
              if sudo docker compose ps --status running 2>/dev/null | grep -qE '(Up|running|healthy)'; then
                HEALTHY=true
                echo "✅ token-factory 容器运行中 (第 ${i} 次检查)"
                break
              fi
              echo "⏳ 等待... (${i}/5)"
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "⚠️ 健康检查未通过, 当前容器状态:"
              sudo docker compose ps
              sudo docker compose logs --tail=30
              exit 1
            fi

            sudo docker compose ps

      - name: Cleanup old images (43.132.223.112)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_A_HOST }}
          port: ${{ secrets.SERVER_A_PORT || 22 }}
          username: ${{ secrets.SERVER_A_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_112 }}
          script: |
            echo ">>> Cleaning up images older than 72h..."
            sudo docker image prune || true
            echo "✅ Cleanup done"

      - name: Save image & transfer to Server B (43.138.142.105)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_A_HOST }}
          port: ${{ secrets.SERVER_A_PORT || 22 }}
          username: ${{ secrets.SERVER_A_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_112 }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
            TAR_FILE="/home/ubuntu/token-factory-${{ inputs.tag }}.tar"
            TARGET_IP="${{ secrets.SERVER_B_HOST }}"
            KEY_FILE="/home/ubuntu/.ssh/ssh_key_b_$$"

            echo "========================================="
            echo "  中转镜像到 Server B: $TARGET_IP"
            echo "  镜像:  $IMAGE"
            echo "========================================="

            echo ""
            echo "[1/4] Setting up SSH key for Server B..."
            cat > "$KEY_FILE" << 'EOFBKEY'
            ${{ secrets.SSH_PRIVATE_KEY_105 }}
            EOFBKEY
            chmod 600 "$KEY_FILE"
            echo "✅ Key ready (PID $$)"

            echo ""
            echo "[2/4] Saving image..."
            sudo docker save -o "$TAR_FILE" "$IMAGE"
            # 让 ubuntu 用户能读取 tar (sudo 生成的文件属主是 root)
            sudo chmod 644 "$TAR_FILE"
            echo "✅ Saved: $(ls -lh "$TAR_FILE" | awk '{print $5}')"

            echo ""
            echo "[3/4] Transferring to $TARGET_IP..."
            scp -i "$KEY_FILE" -o StrictHostKeyChecking=no "$TAR_FILE" ubuntu@"$TARGET_IP":/home/ubuntu/tokease-token-factory/
            echo "✅ Transferred"

            echo ""
            echo "[4/4] Cleaning up..."
            rm -f "$KEY_FILE"
            sudo rm -f "$TAR_FILE"
            echo "✅ Done — Server B can now load the image"

      - name: Summary (Server A)
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ICON="$([ "$STATUS" = "success" ] && echo '✅' || echo '❌')"
          {
            echo "### ${ICON} Server A (43.132.223.112) — ${STATUS}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 镜像 | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}\` |"
            echo "| 实例1 | tokease-token-factory |"
            echo "| 实例2 | token-factory |"
          } >> $GITHUB_STEP_SUMMARY

  # ═════════════════════════════════════════════════════════════════════════
  # 服务器 B: 43.138.142.105  (SSH Key 认证)
  # ═════════════════════════════════════════════════════════════════════════
  deploy-server-b:
    name: Deploy → 43.138.142.105
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy-server-a

    steps:
      - name: Deploy tokease-token-factory (43.138.142.105)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_B_HOST }}
          port: ${{ secrets.SERVER_B_PORT || 22 }}
          username: ${{ secrets.SERVER_B_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_105 }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
            TAR_FILE="/home/ubuntu/tokease-token-factory/token-factory-${{ inputs.tag }}.tar"
            DIR="/home/ubuntu/tokease-token-factory"

            echo "========================================="
            echo "  服务器: ${{ secrets.SERVER_B_HOST }}"
            echo "  实例:   tokease-token-factory"
            echo "  镜像:   $IMAGE"
            echo "  时间:   $(date '+%Y-%m-%d %H:%M:%S')"
            echo "========================================="

            cd "$DIR" || { echo "❌ 目录不存在: $DIR"; exit 1; }

            echo ""
            echo "[1/3] Loading image from tar..."
            sudo docker load -i "$TAR_FILE"
            sudo rm -f "$TAR_FILE"

            echo ""
            echo "[2/3] Starting services..."
            sudo docker compose up -d

            echo ""
            echo "[3/3] Health check..."
            sleep 5
            HEALTHY=false
            for i in 1 2 3 4 5; do
              if sudo docker compose ps --status running 2>/dev/null | grep -qE '(Up|running|healthy)'; then
                HEALTHY=true
                echo "✅ tokease-token-factory 容器运行中 (第 ${i} 次检查)"
                break
              fi
              echo "⏳ 等待... (${i}/5)"
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "⚠️ 健康检查未通过, 当前容器状态:"
              sudo docker compose ps
              sudo docker compose logs --tail=30
              exit 1
            fi

            sudo docker compose ps

      - name: Deploy token-factory (43.138.142.105)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_B_HOST }}
          port: ${{ secrets.SERVER_B_PORT || 22 }}
          username: ${{ secrets.SERVER_B_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_105 }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
            DIR="/home/ubuntu/token-factory"

            echo "========================================="
            echo "  服务器: ${{ secrets.SERVER_B_HOST }}"
            echo "  实例:   token-factory"
            echo "  镜像:   $IMAGE"
            echo "========================================="

            cd "$DIR" || { echo "❌ 目录不存在: $DIR"; exit 1; }

            echo "[1/2] Starting services (镜像已在 tokease 步骤加载)..."
            sudo docker compose up -d

            echo "[2/2] Health check..."
            sleep 5
            HEALTHY=false
            for i in 1 2 3 4 5; do
              if sudo docker compose ps --status running 2>/dev/null | grep -qE '(Up|running|healthy)'; then
                HEALTHY=true
                echo "✅ token-factory 容器运行中 (第 ${i} 次检查)"
                break
              fi
              echo "⏳ 等待... (${i}/5)"
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "⚠️ 健康检查未通过, 当前容器状态:"
              sudo docker compose ps
              sudo docker compose logs --tail=30
              exit 1
            fi

            sudo docker compose ps

      - name: Cleanup old images (43.138.142.105)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_B_HOST }}
          port: ${{ secrets.SERVER_B_PORT || 22 }}
          username: ${{ secrets.SERVER_B_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_105 }}
          script: |
            echo ">>> Cleaning up images older than 72h..."
            sudo docker image prune || true
            echo "✅ Cleanup done"

      - name: Summary (Server B)
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ICON="$([ "$STATUS" = "success" ] && echo '✅' || echo '❌')"
          {
            echo "### ${ICON} Server B (43.138.142.105) — ${STATUS}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 镜像 | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}\` |"
            echo "| 实例1 | tokease-token-factory |"
            echo "| 实例2 | token-factory |"
          } >> $GITHUB_STEP_SUMMARY
