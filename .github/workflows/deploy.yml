            echo "### ${ICON} Server B (43.138.142.105) — ${STATUS}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 镜像 | \`${{ env.REGISTRY_ACR }}/${{ env.IMAGE_NAME_ACR }}:${{ inputs.tag }}\` |"
            echo "| 实例1 | tokease-token-factory |"
            echo "| 实例2 | demo-tokease-token-factory |"
            echo "| 实例3 | token-factory |"
            echo "| 实例4 | token-factory-123-tok |"
          } >> $GITHUB_STEP_SUMMARY

  # ═════════════════════════════════════════════════════════════════════════
  # Node2: 139.199.57.140  (SSH Key 认证，镜像走 ACR)
  # ═════════════════════════════════════════════════════════════════════════
  deploy-node2:
    name: Deploy → Node2 139.199.57.140
    needs: validate-inputs
    if: ${{ github.event.inputs.deploy_node2 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Login to ACR (Node2)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_NODE2_HOST }}
          port: ${{ secrets.SERVER_NODE2_PORT || 22 }}
          username: ${{ secrets.SERVER_NODE2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_NODE2 }}
          script: |
            set -e
            echo "${{ secrets.ACR_ALLINONE_PASSWORD }}" | sudo docker login \
              ${{ env.REGISTRY_ACR }} \
              -u "${{ secrets.ACR_ALLINONE_USERNAME }}" \
              --password-stdin
            echo "✅ ACR login success"

      - name: Deploy tokease-token-factory (139.199.57.140)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_NODE2_HOST }}
          port: ${{ secrets.SERVER_NODE2_PORT || 22 }}
          username: ${{ secrets.SERVER_NODE2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_NODE2 }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY_ACR }}/${{ env.IMAGE_NAME_ACR }}:${{ inputs.tag }}"
            DIR="/home/ubuntu/tokease-token-factory"

            echo "========================================="
            echo "  服务器: Node2 ${{ secrets.SERVER_NODE2_HOST }}"
            echo "  实例:   tokease-token-factory"
            echo "  镜像:   $IMAGE"
            echo "  时间:   $(date '+%Y-%m-%d %H:%M:%S')"
            echo "========================================="

            cd "$DIR" || { echo "❌ 目录不存在: $DIR"; exit 1; }

            echo ""
            echo "[1/3] Pulling image from ACR..."
            sudo docker compose pull

            echo ""
            echo "[2/3] Starting services..."
            sudo docker compose up -d

            echo ""
            echo "[3/3] Health check..."
            sleep 5
            HEALTHY=false
            for i in 1 2 3 4 5; do
              if sudo docker compose ps --status running 2>/dev/null | grep -qE '(Up|running|healthy)'; then
                HEALTHY=true
                echo "✅ tokease-token-factory 容器运行中 (第 ${i} 次检查)"
                break
              fi
              echo "⏳ 等待... (${i}/5)"
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "⚠️ 健康检查未通过, 当前容器状态:"
              sudo docker compose ps
              sudo docker compose logs --tail=30
              exit 1
            fi

            sudo docker compose ps

      - name: Deploy seedance2-factory (139.199.57.140)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_NODE2_HOST }}
          port: ${{ secrets.SERVER_NODE2_PORT || 22 }}
          username: ${{ secrets.SERVER_NODE2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_NODE2 }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY_ACR }}/${{ env.IMAGE_NAME_ACR }}:${{ inputs.tag }}"
            DIR="/home/ubuntu/seedance2-factory-stack/seedance2-factory"

            echo "========================================="
            echo "  服务器: Node2 ${{ secrets.SERVER_NODE2_HOST }}"
            echo "  实例:   seedance2-factory"
            echo "  镜像:   $IMAGE"
            echo "  时间:   $(date '+%Y-%m-%d %H:%M:%S')"
            echo "========================================="

            cd "$DIR" || { echo "❌ 目录不存在: $DIR"; exit 1; }

            echo ""
            echo "[1/3] Pulling image from ACR..."
            sudo docker compose -f docker-compose.yaml pull

            echo ""
            echo "[2/3] Starting services..."
            sudo docker compose -f docker-compose.yaml up -d

            echo ""
            echo "[3/3] Health check..."
            sleep 5
            HEALTHY=false
            for i in 1 2 3 4 5; do
              if sudo docker compose -f docker-compose.yaml ps --status running 2>/dev/null | grep -qE '(Up|running|healthy)'; then
                HEALTHY=true
                echo "✅ seedance2-factory 容器运行中 (第 ${i} 次检查)"
                break
              fi
              echo "⏳ 等待... (${i}/5)"
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "⚠️ 健康检查未通过, 当前容器状态:"
              sudo docker compose -f docker-compose.yaml ps
              sudo docker compose -f docker-compose.yaml logs --tail=30
              exit 1
            fi

            sudo docker compose -f docker-compose.yaml ps

      - name: Cleanup old images (Node2)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_NODE2_HOST }}
          port: ${{ secrets.SERVER_NODE2_PORT || 22 }}
          username: ${{ secrets.SERVER_NODE2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_NODE2 }}
          script: |
            echo ">>> Cleaning up images older than 72h..."
            sudo docker image prune || true
            echo "✅ Cleanup done"

      - name: Summary (Node2)
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ICON="$([ "$STATUS" = "success" ] && echo '✅' || echo '❌')"
          {
            echo "### ${ICON} Node2 (139.199.57.140) — ${STATUS}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 镜像 | \`${{ env.REGISTRY_ACR }}/${{ env.IMAGE_NAME_ACR }}:${{ inputs.tag }}\` |"
            echo "| 实例1 | tokease-token-factory |"
            echo "| 实例2 | seedance2-factory |"
          } >> $GITHUB_STEP_SUMMARY
