name: Deploy to Servers

# ============================================================================
# Token Factory — SSH 远程部署工作流
#
# 前提: 先手动运行 "编译 Docker 镜像 (GHCR + ACR)" 构建并推送镜像
#
# 镜像源:
#   服务器 A → ghcr.io/fyinfor/token-factory:<tag>
#   服务器 B → crpi-sk2z151c9de4cnvh.cn-hangzhou.personal.cr.aliyuncs.com/fyinfor123/token-factory:<tag>
#   Node2    → crpi-sk2z151c9de4cnvh.cn-hangzhou.personal.cr.aliyuncs.com/fyinfor123/token-factory:<tag>
#
# 部署目标:
#   服务器 A (43.132.223.112):
#     ├─ /home/ubuntu/tokease-token-factory
#     └─ /home/ubuntu/token-factory
#   服务器 B (43.138.142.105):
#     ├─ /home/ubuntu/tokease-token-factory
#     ├─ /home/ubuntu/demo-tokease-token-factory
#     ├─ /home/ubuntu/token-factory
#     └─ /home/ubuntu/token-factory-123-tok
#   Node2 (139.199.57.140):
#     ├─ /home/ubuntu/tokease-token-factory
#     └─ /home/ubuntu/seedance2-factory-stack
#
# 手动触发可选部署目标（默认全部部署）:
#   deploy_server_a → 112 HK
#   deploy_server_b → 105 Tencent
#   deploy_node2    → 140 Node2
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签'
        required: true
        default: 'latest'
        type: string
      deploy_server_a:
        description: '部署到 112 HK 国际站 (43.132.223.112)'
        type: boolean
        default: true
      deploy_server_b:
        description: '部署到 105 Tencent 国内站 (43.138.142.105)'
        type: boolean
        default: true
      deploy_node2:
        description: '部署到 Node2 (139.199.57.140)'
        type: boolean
        default: true

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME_GHCR: fyinfor/token-factory
  REGISTRY_ACR: crpi-sk2z151c9de4cnvh.cn-hangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME_ACR: fyinfor123/token-factory

jobs:
  validate-inputs:
    name: Validate deploy targets
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one server
        if: ${{ github.event.inputs.deploy_server_a != 'true' && github.event.inputs.deploy_server_b != 'true' && github.event.inputs.deploy_node2 != 'true' }}
        run: |
          echo "::error::请至少勾选一台服务器（112 / 105 / Node2）"
          exit 1

  # ═════════════════════════════════════════════════════════════════════════
  # 服务器 A: 43.132.223.112  (SSH Key 认证)
  # ═════════════════════════════════════════════════════════════════════════
  deploy-server-a:
    name: Deploy → 43.132.223.112
    needs: validate-inputs
    if: ${{ github.event.inputs.deploy_server_a == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy tokease-token-factory (43.132.223.112)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_A_HOST }}
          port: ${{ secrets.SERVER_A_PORT || 22 }}
          username: ${{ secrets.SERVER_A_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_112 }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}:${{ inputs.tag }}"
            DIR="/home/ubuntu/tokease-token-factory"

            echo "========================================="
            echo "  服务器: ${{ secrets.SERVER_A_HOST }}"
            echo "  实例:   tokease-token-factory"
            echo "  镜像:   $IMAGE"
            echo "  时间:   $(date '+%Y-%m-%d %H:%M:%S')"
            echo "========================================="

            cd "$DIR" || { echo "❌ 目录不存在: $DIR"; exit 1; }

            echo ""
            echo "[1/3] Pulling image..."
            sudo docker compose pull

            echo ""
            echo "[2/3] Starting services..."
            sudo docker compose up -d

            echo ""
            echo "[3/3] Health check..."
            sleep 5
            HEALTHY=false
            for i in 1 2 3 4 5; do
              # 检查容器是否 running
              if sudo docker compose ps --status running 2>/dev/null | grep -qE '(Up|running|healthy)'; then
                HEALTHY=true
                echo "✅ tokease-token-factory 容器运行中 (第 ${i} 次检查)"
                break
              fi
              echo "⏳ 等待... (${i}/5)"
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "⚠️ 健康检查未通过, 当前容器状态:"
              sudo docker compose ps
              sudo docker compose logs --tail=30
              exit 1
            fi

            sudo docker compose ps

      - name: Deploy token-factory (43.132.223.112)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_A_HOST }}
          port: ${{ secrets.SERVER_A_PORT || 22 }}
          username: ${{ secrets.SERVER_A_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_112 }}
          script: |
            set -e
            IMAGE="${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}:${{ inputs.tag }}"
            DIR="/home/ubuntu/token-factory"

            echo "========================================="
            echo "  服务器: ${{ secrets.SERVER_A_HOST }}"
            echo "  实例:   token-factory"
            echo "  镜像:   $IMAGE"
            echo "========================================="

            cd "$DIR" || { echo "❌ 目录不存在: $DIR"; exit 1; }

            echo "[1/3] Pulling image..."
            sudo docker compose pull

            echo "[2/3] Starting services..."
            sudo docker compose up -d

            echo "[3/3] Health check..."
            sleep 5
            HEALTHY=false
            for i in 1 2 3 4 5; do
              if sudo docker compose ps --status running 2>/dev/null | grep -qE '(Up|running|healthy)'; then
                HEALTHY=true
                echo "✅ token-factory 容器运行中 (第 ${i} 次检查)"
                break
              fi
              echo "⏳ 等待... (${i}/5)"
              sleep 10
            done

            if [ "$HEALTHY" = false ]; then
              echo "⚠️ 健康检查未通过, 当前容器状态:"
              sudo docker compose ps
              sudo docker compose logs --tail=30
              exit 1
            fi

            sudo docker compose ps

      - name: Cleanup old images (43.132.223.112)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_A_HOST }}
          port: ${{ secrets.SERVER_A_PORT || 22 }}
          username: ${{ secrets.SERVER_A_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_112 }}
          script: |
            echo ">>> Cleaning up images older than 72h..."
            sudo docker image prune || true
            echo "✅ Cleanup done"

      - name: Summary (Server A)
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ICON="$([ "$STATUS" = "success" ] && echo '✅' || echo '❌')"
          {
            echo "### ${ICON} Server A (43.132.223.112) — ${STATUS}"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 镜像 | \`${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}:${{ inputs.tag }}\` |"
            echo "| 实例1 | tokease-token-factory |"
            echo "| 实例2 | token-factory |"
          } >> $GITHUB_STEP_SUMMARY

  # ═════════════════════════════════════════════════════════════════════════
  # 服务器 B: 43.138.142.105  (SSH Key 认证)
  # ═════════════════════════════════════════════════════════════════════════
  deploy-server-b:
    name: Deploy → 43.138.142.105
    needs: validate-inputs
    if: ${{ github.event.inputs.deploy_server_b == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Login to ACR (43.138.142.105)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_B_HOST }}
          port: ${{ secrets.SERVER_B_PORT || 22 }}
          username: ${{ secrets.SERVER_B_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_105 }}
          script: |
            set -e
            echo "${{ secrets.ACR_ALLINONE_PASSWORD }}" | sudo docker login \
              ${{ env.REGISTRY_ACR }} \
              -u "${{ secrets.ACR_ALLINONE_USERNAME }}" \
              --password-stdin
            echo "✅ ACR login success"

      - name: Deploy tokease-token-factory (43.138.142.105)
