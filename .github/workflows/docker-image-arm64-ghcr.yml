# 手动触发：仅构建 linux/arm64，双推送到 GHCR 与阿里云 ACR。
# 与 docker-image-ghcr.yml（amd64）并列；与 docker-image-arm64.yml（上游 Docker Hub 多架构）无关。
# 标签强制带 -arm64 后缀，避免覆盖 x86 镜像。
#
# 拉取示例：
#   GHCR：docker pull ghcr.io/fyinfor/token-factory:latest-arm64
#   ACR：docker pull crpi-sk2z151c9de4cnvh.cn-hangzhou.personal.cr.aliyuncs.com/fyinfor123/token-factory:latest-arm64
#
# 标签规则：
#   <自定义>-arm64   填 tag_suffix 时（默认 latest → latest-arm64）
#   <git SHA>-arm64  tag_suffix 留空时
#
# ARM 服务器 docker-compose 示例：
#   image: ghcr.io/fyinfor/token-factory:latest-arm64

name: 编译 Docker 镜像 ARM64 (GHCR + ACR)

on:
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: '基础标签（自动追加 -arm64；如填 latest → latest-arm64；留空则用 git SHA-arm64）'
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILDKIT: 1
  REGISTRY_ACR: crpi-sk2z151c9de4cnvh.cn-hangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME_ACR: fyinfor123/token-factory

jobs:
  build-image-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: GHCR 镜像路径（owner / 仓库名必须小写）
        id: ghcr
        run: |
          owner_lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          repo_lower=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lower}/${repo_lower}" >> "$GITHUB_OUTPUT"
          echo "repo_pkg=${repo_lower}" >> "$GITHUB_OUTPUT"

      - name: Resolve arm64 tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_suffix }}" ]; then
            base="${{ github.event.inputs.tag_suffix }}"
          else
            base="${{ github.sha }}"
          fi
          # 避免重复追加 -arm64
          case "$base" in
            *-arm64) image_tag="$base" ;;
            *)       image_tag="${base}-arm64" ;;
          esac
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${image_tag}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Alibaba Cloud ACR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY_ACR }}
          username: ${{ secrets.ACR_ALLINONE_USERNAME }}
          password: ${{ secrets.ACR_ALLINONE_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ steps.ghcr.outputs.image }}
            ${{ env.REGISTRY_ACR }}/${{ env.IMAGE_NAME_ACR }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.image_tag }}

      - name: Build and push arm64 (GHCR + ACR)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          secrets: |
            github_token=${{ secrets.FYINFOR_GH_PAT }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          cache-from: type=gha,scope=ghcr-docker-arm64-${{ github.repository_id }}
          cache-to: type=gha,mode=max,scope=ghcr-docker-arm64-${{ github.repository_id }}

      - name: 构建摘要（拉取地址）
        run: |
          image_tag="${{ steps.tag.outputs.image_tag }}"
          acr_image="${{ env.REGISTRY_ACR }}/${{ env.IMAGE_NAME_ACR }}"
          {
            echo "## ARM64 镜像已推送（GHCR + 阿里云 ACR）"
            echo ""
            echo "- **架构**：\`linux/arm64\`"
            echo "- **本次标签**：\`${image_tag}\`"
            echo "- **注意**：与 amd64 的 \`latest\` 等标签隔离，不会覆盖 x86 镜像"
            echo ""
            echo "### GHCR"
            echo "- **Packages**：\`https://github.com/${{ github.repository }}/pkgs/container/${{ steps.ghcr.outputs.repo_pkg }}\`"
            echo "- **拉取**：\`docker pull ${{ steps.ghcr.outputs.image }}:${image_tag}\`"
            echo ""
            echo "### 阿里云 ACR"
            echo "- **拉取**：\`docker pull ${acr_image}:${image_tag}\`"
            echo ""
            echo "### ARM 服务器 compose"
            echo '```yaml'
            echo "image: ${{ steps.ghcr.outputs.image }}:${image_tag}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
